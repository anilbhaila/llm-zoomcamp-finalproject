[project]
name = "llm-zoomcamp-finalproject"
version = "0.1.0"
description = "This is my final Project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "elasticsearch>=8,<9",
    "matplotlib>=3.11.1",
    "minsearch>=0.2.0",
    "openai>=2.48.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "requests>=2.28.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.7.0",
    "spacy>=3.8.15",
    "streamlit>=1.60.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

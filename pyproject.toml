[project]
name = "llm-zoomcamp-finalproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "anilbhaila", email = "anil.bhaila.2020@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "minsearch>=0.2.0",
    "openai>=2.51.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "requests>=2.28.1",
    "sentence-transformers>=5.6.1",
    "sqlitesearch>=0.3.0",
    "streamlit>=1.61.0",
    "toyaikit>=0.0.11",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[project.scripts]
llm-zoomcamp-finalproject = "llm_zoomcamp_finalproject:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
